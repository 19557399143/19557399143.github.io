<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,p {
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Mycmd</h1>
    <p id="p">starting<span></span></p>
    <script>
        const p = document.querySelector('#p span')
        let i = 0
        setInterval(() => {
            if (i = 4) {
                i = 0
                p.innerHTML = ''
            } else {
                i++
                p.innerHTML += '.'
            }
        }, 800);
    </script>
</body>
</html>
